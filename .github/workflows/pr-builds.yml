name: PR builds - Windows x64 and Apple Silicon

# Validate cross-platform installers before merging. Never publish releases
# from pull requests, and do not expose repository secrets to untrusted code.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 (Whisper CPU)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Qt 6.11 is not yet reliably available via aqtinstall on Windows;
      # match the repository's existing release workflow.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # The release workflow separately builds CUDA/Vulkan. PR builds use
      # Whisper CPU to compile the full ASR integration at lower CI cost.
      - name: Build CPU-only installer
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Installer -Variants cpu -QtPrefix $env:QT_ROOT_DIR

      - name: Verify installer exists
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path build -Filter "voiceTyper-*-cpu-setup.exe" -File)
          if ($files.Count -ne 1) { throw "Expected one Windows CPU installer, found $($files.Count)." }
          $files | Select-Object Name, Length | Format-Table

      - name: Upload Windows test installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-cpu-installer
          path: build/voiceTyper-*-cpu-setup.exe
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    name: macOS M1/Apple Silicon (Whisper Metal)
    # macos-15 is a native M1 arm64 hosted runner, not an Intel runner.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Apple Silicon runner
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          host: mac
          target: desktop
          modules: qtmultimedia

      # No downloaded Whisper model is bundled: test artifacts are small,
      # and the user can select/download a model after installing.
      # The DMG is ad-hoc signed, not notarized.
      - name: Package Apple Silicon DMG (Metal enabled)
        env:
          QT_DIR: ${{ env.QT_ROOT_DIR }}
          VT_PACKAGE_MODEL: none
          VOICETYPER_EXTRA_CMAKE_ARGS: "-DCMAKE_OSX_ARCHITECTURES=arm64 -DGGML_METAL=ON -DVOICETYPER_WITH_CUDA=OFF -DVOICETYPER_WITH_VULKAN=OFF"
        run: scripts/package-macos.sh

      - name: Verify arm64 executable and DMG
        run: |
          file build-package/voiceTyper
          lipo -archs build-package/voiceTyper | grep -qw arm64
          test -n "$(find . -maxdepth 1 -name 'voiceTyper-*.dmg' -print -quit)"
          shasum -a 256 voiceTyper-*.dmg

      - name: Upload macOS test DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-metal-dmg
          path: voiceTyper-*.dmg
          if-no-files-found: error
          retention-days: 7
